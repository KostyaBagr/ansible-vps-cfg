all:
  hosts:
    server-1:
      ansible_host: "{{ lookup('env', 'VPS_IP') }}"
      ansible_connection: ssh
      ansible_user: "{{ lookup('env', 'VPS_USER') }}"
      # VPS_AUTH_METHOD: password (default) | key
      ansible_password: "{{ lookup('env', 'VPS_USER_PASSWORD') if (lookup('env', 'VPS_AUTH_METHOD') | default('password', true)) == 'password' else omit }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'VPS_SSH_PRIVATE_KEY') if (lookup('env', 'VPS_AUTH_METHOD') | default('password', true)) == 'key' else omit }}"
